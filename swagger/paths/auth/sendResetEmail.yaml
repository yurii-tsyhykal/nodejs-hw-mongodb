tags:
  - Auth
summary: Send reset User password
operationId: sendResetEmail
description: >
  This operation sends a password reset email to the user based on the provided email address.
  The email contains a link to reset the user's password.
security: []
requestBody:
  required: true
  content:
    application.json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: 'User’s email to send the reset email'
            type: string
            example: 'example@gmail.com'
responses:
  '200':
    description: 'Reset password email has been successfully sent.'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email has been successfully sent.'
  '400':
    description: 'Bad request due to invalid field'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
        examples:
          validEmail:
            description: 'Email field must be a valid email'
            value:
              status: 400
              message: '\"email\" must be a valid email'
          emptyEmail:
            description: 'Email is not allowed to be empty'
            value:
              status: 400
              message: '\"email\" is not allowed to be empty'
          requiredEmail:
            description: 'Email is required'
            value:
              status: 400
              message: '\"email\" is required'
  '404':
    $ref: ../../components/responses/users/404.yaml
  '500':
    description: 'Internal Server Error'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: 'Failed to send the email, please try again later.'
