tags:
  - Auth
summary: Register User
operationId: registerUser
description: 'Register a new user with payload'
security: []
requestBody:
  content:
    application.json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: 'Username'
            type: string
            example: 'Kateryna Povalenko'
          email:
            description: 'User’s email'
            type: string
            example: 'example@gmail.com'
          password:
            description: 'User’s password'
            type: string
            example: '12345qwery'
responses:
  '201':
    description: Registered a user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully registered a user!'
            data:
              type: object
              $ref: ../../components/schemas/newUser.yaml
  '400':
    description: 'Bad request due to invalid fields'
    content:
      application/json:
        $ref: '../../components/responses/users/registration/400user.yaml'
  '409':
    description: 'Email is already in use'
    content:
      application/json:
        $ref: '../../components/responses/users/registration/409.yaml'
