tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: >
  Retrieves a complete list of contacts from the database, including  `name`, `email`, `phone number`, `contactType`, `userId` and other(look in example). 
  This endpoint supports optional query parameters for `filtering`, `sorting`, and `pagination`.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
      example: 2
  - in: query
    name: perPage
    schema:
      type: integer
      default: 10
      example: 8
  - in: query
    name: sortBy
    description: "You can sort contacts by name. If the 'sortBy' field exists in the query parameters, contacts will be sorted by '_id' by default."
    schema:
      type: string
      default: _id
      example: '?sortBy=Kateryna Povalenko'
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      default: 'asc'
      example: 'desc'
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      default: personal
      example: work
  - in: query
    name: isFavourite
    schema:
      type: boolean
      default: false
      example: true
responses:
  '200':
    description: 'Successfully found contacts!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: ../../components/responses/authErrors/401.yaml